name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: "Guard: generated skill and subagent copies must not drift"
        run: |
          node scripts/sync-skills.mjs --check
          node scripts/sync-agents.mjs --check

      - name: Build index from upstream
        run: npm run sync

      - name: Search quality eval
        run: npm run eval

      - name: Smoke-test MCP server over stdio
        run: npm run smoke

      - name: Smoke-test background index refresh
        run: npm run smoke:refresh

      - name: Verify the agent workflow
        run: npm run eval:workflow

      - name: Verify the permissions check
        run: npm run eval:permissions

      # Not a gate: it prints the sizes the README quotes, so they stay current.
      - name: Print what a read costs
        run: npm run cost
