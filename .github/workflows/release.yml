name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in release builds (npm docs)

      - run: npm ci
      - run: npm run build

      - name: Refresh index from upstream
        run: npm run sync

      - name: Verify search quality
        run: npm run eval

      - name: Smoke-test MCP server
        run: npm run smoke

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            data/hacktricks.db
            data/toc.json
          generate_release_notes: true

      # Trusted publishing: OIDC auth via id-token, provenance is automatic
      # for public repo + public package. No NPM_TOKEN needed.
      - name: Publish to npm
        run: npm publish --access public

      - name: Stamp server.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node -e "
            const fs = require('fs');
            const s = JSON.parse(fs.readFileSync('server.json', 'utf8'));
            s.version = '$VERSION';
            for (const p of s.packages ?? []) p.version = '$VERSION';
            fs.writeFileSync('server.json', JSON.stringify(s, null, 2) + '\n');
          "

      - name: Install mcp-publisher (pinned + checksum-verified)
        run: |
          VERSION="v1.8.1"
          BASE="https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}"
          curl -fsSL "${BASE}/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher_linux_amd64.tar.gz
          curl -fsSL "${BASE}/registry_${VERSION#v}_checksums.txt" -o checksums.txt
          grep " mcp-publisher_linux_amd64.tar.gz$" checksums.txt | sha256sum -c -
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher

      - name: Publish to MCP registry (OIDC, retry for npm propagation)
        run: |
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          for i in 1 2 3 4 5; do
            if ./mcp-publisher publish; then exit 0; fi
            echo "Attempt $i failed, waiting 60s for npm propagation..."
            sleep 60
          done
          exit 1
