name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # required for npm trusted publishing (OIDC provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run build

      - name: Refresh index from upstream
        run: npm run sync

      - name: Verify search quality
        run: npm run eval

      - name: Smoke-test MCP server
        run: npm run smoke

      - name: Publish to npm
        run: npm publish --access public --provenance
