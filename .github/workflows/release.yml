name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in release builds (npm docs)

      - run: npm ci
      - run: npm run build

      - name: Refresh index from upstream
        run: npm run sync

      - name: Verify search quality
        run: npm run eval

      - name: Smoke-test MCP server
        run: npm run smoke

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            data/hacktricks.db
            data/toc.json
          generate_release_notes: true

      # Trusted publishing: OIDC auth via id-token, provenance is automatic
      # for public repo + public package. No NPM_TOKEN needed.
      - name: Publish to npm
        run: npm publish --access public
