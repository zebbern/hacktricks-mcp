name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # sync.yml dispatches this on the new v* tag after an index change. A tag
    # pushed with GITHUB_TOKEN does not fire the push trigger above. Dispatched
    # on a branch, it releases the version the branch holds, and repeats nothing
    # that an earlier run already did for that version.

permissions:
  contents: write
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in release builds (npm docs)

      - run: npm ci
      - run: npm run build

      # Only used when this is dispatched on a branch instead of a v* tag.
      - name: Resolve version tag
        id: tag
        run: echo "name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Refresh index from upstream
        run: npm run sync

      - name: Verify search quality
        run: npm run eval

      - name: Verify the agent workflow
        run: npm run eval:workflow

      - name: Verify the permissions check
        run: npm run eval:permissions

      - name: Smoke-test MCP server
        run: npm run smoke

      - name: Smoke-test background index refresh
        run: npm run smoke:refresh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.tag.outputs.name }}
          # meta.json lets a running server notice a newer index (src/refresh.ts).
          files: |
            data/hacktricks.db
            data/toc.json
            data/meta.json
          generate_release_notes: true

      # Trusted publishing: OIDC auth via id-token, provenance is automatic
      # for public repo + public package. No NPM_TOKEN needed. npm never
      # replaces a version, so a run dispatched again for one that npm already
      # has, for example to redo the registry job, must not fail here.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          URL="https://registry.npmjs.org/@zebbern%2Fhacktricks-mcp/$VERSION"
          if curl -fsS -o /dev/null -H "Cache-Control: no-cache" "$URL"; then
            echo "npm already serves $VERSION, not publishing again"
            exit 0
          fi
          out="$(npm publish --access public 2>&1)"; rc=$?
          echo "$out"
          if [ $rc -ne 0 ] && echo "$out" | grep -q "cannot publish over the previously published versions"; then
            echo "npm already has $VERSION, not publishing again"
            exit 0
          fi
          exit $rc

      # Housekeeping, after everything that must succeed: running servers only
      # ever download the latest release (src/refresh.ts), so older releases
      # keep their notes and tag but not their 64 MB of index files. A failed
      # removal must not fail the release.
      - name: Remove index files from older releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ steps.tag.outputs.name }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select(.tag_name != "'"$KEEP"'") | .tag_name as $tag
                   | .assets[] | select(.name == "hacktricks.db" or .name == "toc.json" or .name == "meta.json")
                   | "\($tag) \(.name)"' \
            | while read -r tag asset; do
                echo "removing $asset from $tag"
                gh release delete-asset "$tag" "$asset" --yes
              done

  # The registry lists a server by npm version, so its listing would go stale
  # with every release unless it is published here as well. Its trusted
  # publishing works like npm's: OIDC, no stored token. This is a job of its
  # own because it waits on something outside this repository: npm keeps a new
  # version for validation before it serves it, and that took longer than the
  # seven minutes an earlier version of this workflow allowed. If npm is slower
  # than the hour below, "re-run failed jobs" repeats only this job.
  registry:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Resolve version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install mcp-publisher (pinned + checksum-verified)
        run: |
          VERSION="v1.8.21"
          BASE="https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}"
          curl -fsSL "${BASE}/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher_linux_amd64.tar.gz
          curl -fsSL "${BASE}/registry_${VERSION#v}_checksums.txt" -o checksums.txt
          grep " mcp-publisher_linux_amd64.tar.gz$" checksums.txt | sha256sum -c -
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher

      # Asked directly, without npm's cache: the registry checks the package on
      # npm, which does not serve a version until its validation is done.
      - name: Wait for npm to serve the version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://registry.npmjs.org/@zebbern%2Fhacktricks-mcp/$VERSION"
          for i in $(seq 1 120); do
            if curl -fsS -o /dev/null -H "Cache-Control: no-cache" "$URL"; then
              echo "npm serves $VERSION"
              exit 0
            fi
            echo "waiting for npm... (attempt $i)"
            sleep 30
          done
          echo "npm still does not serve $VERSION after an hour; re-run this job once it does"
          exit 1

      # A failure here is meant to fail the run: the package and the GitHub
      # release are already out, and the listing is what registry users see.
      # The same three commands can be run locally (docs/agents.md).
      - name: Publish to the MCP registry (OIDC)
        run: |
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
