name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # sync.yml dispatches this on the new v* tag after an index change. A tag
    # pushed with GITHUB_TOKEN does not fire the push trigger above.

permissions:
  contents: write
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in release builds (npm docs)

      - run: npm ci
      - run: npm run build

      # Only used when this is dispatched on a branch instead of a v* tag.
      - name: Resolve version tag
        id: tag
        run: echo "name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Refresh index from upstream
        run: npm run sync

      - name: Verify search quality
        run: npm run eval

      - name: Smoke-test MCP server
        run: npm run smoke

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.tag.outputs.name }}
          files: |
            data/hacktricks.db
            data/toc.json
          generate_release_notes: true

      # Trusted publishing: OIDC auth via id-token, provenance is automatic
      # for public repo + public package. No NPM_TOKEN needed.
      - name: Publish to npm
        run: npm publish --access public

      # Note: MCP registry publishing is done locally with mcp-publisher
      # (see docs/agents.md), not in CI.
